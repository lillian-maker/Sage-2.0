pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    log_format sage_no_query '$time_iso8601 $request_method $uri $status $body_bytes_sent $request_time $request_id';
    access_log /dev/stdout sage_no_query;
    server {
        listen 8443 ssl default_server;
        ssl_reject_handshake on;
    }
    server {
        listen 8443 ssl;
        server_name sagegogo.com;
        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        if ($host != sagegogo.com) { return 444; }
        auth_basic "Sage controlled preview";
        auth_basic_user_file /run/secrets/preview_htpasswd;
        root /srv/sage/dist;
        index index.html;
        autoindex off;
        client_max_body_size 3m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security 'max-age=31536000' always;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For '';
        proxy_set_header X-Forwarded-Protocol '';
        proxy_set_header X-Forwarded-Ssl '';
        proxy_set_header Forwarded '';
        proxy_set_header Authorization '';
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_next_upstream off;
        location = /api/consultations { return 403; }
        # Real OAuth is a separate release gate, including error-log handling.
        location = /api/auth/google/callback { return 403; }
        location ~ /\. { return 404; }
        location = /sales { return 308 /sales/; }
        location ~ ^/(api/|sales/|health/(live|ready)$) { proxy_pass http://app:8000; }
        location /static/ { alias /srv/sage/static/; }
        location /media/ { return 404; }
        location /avatars/ { return 404; }
        location / { try_files $uri $uri/ =404; }
    }
}
