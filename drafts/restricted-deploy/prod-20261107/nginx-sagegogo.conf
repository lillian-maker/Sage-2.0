# /etc/nginx/conf.d/sagegogo.com.conf
# sagegogo.com 公网入口（阶段 B，用户已批准宿主 nginx 反代方案）。
# TLS 在宿主终止后反代到 sage-preview web 容器 8443（经 127.0.0.1:9444 发布口），
# 真实客户端 IP 以 X-Sage-Client-IP 头传递（宿主强制覆写，公网不可伪造）；
# 容器侧仅信任来自固定 edge 网关 172.20.0.1 的该头（realip 模块）。
# IPv6 不监听（执行单阶段 B 要求保持关闭）；shopify.aibobod.com 与 00-default-deny 不受影响。
# 证书复用 /etc/sage/tls/ 现有 TrustAsia 证书（SAN: sagegogo.com + www，2027-01-10 到期）。

# 访问日志：不含查询串（$uri 无 args），满足"网关日志不含查询参数/验证码"验收项；
# $remote_addr 保留用于滥用取证，与隐私政策的访问日志条款一致，宿主保留 180 天。
log_format sage_edge '$time_iso8601 $remote_addr "$request_method $uri" '
                     '$status $body_bytes_sent $request_time "$host"';

server {
    listen 80;
    server_name sagegogo.com www.sagegogo.com;
    access_log /var/log/nginx/sagegogo-access.log sage_edge;
    error_log  /var/log/nginx/sagegogo-error.log crit;
    return 301 https://sagegogo.com$request_uri;
}

server {
    listen 443 ssl;
    server_name sagegogo.com www.sagegogo.com;

    ssl_certificate     /etc/sage/tls/sagegogo.com.fullchain.pem;
    ssl_certificate_key /etc/sage/tls/sagegogo.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:sagegogo:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/sagegogo-access.log sage_edge;
    # Request-level failures are recorded by the container's filtered logs. Keep host
    # errors at critical severity so request lines with query parameters are not persisted.
    error_log  /var/log/nginx/sagegogo-error.log crit;

    client_max_body_size 3m;

    location / {
        proxy_pass https://127.0.0.1:9444;

        proxy_ssl_server_name on;
        proxy_ssl_name sagegogo.com;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        # 验证锚点：系统 CA bundle（fullchain 不含根不能作锚；经系统交叉签名根验证 OK）
        # 深度 2：叶子 → TrustAsia 中间 → 交叉签名根（默认 1 不够）
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;

        # 覆写（而非追加）：容器网关仅信任来自固定 edge 网关的 X-Sage-Client-IP
        proxy_set_header X-Sage-Client-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;

        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_next_upstream off;
    }
}
