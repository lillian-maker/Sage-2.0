# G4 staging website. Separate project, database, volume and network from sage-preview.
# Host nginx terminates TLS for voc.sagegogo.com and serves /srv/sage-staging/dist.
# The app is only published on 127.0.0.1:8001; no public port.
name: sage-staging

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "12"}

x-app: &app
  image: sage-app:${SAGE_STAGING_IMAGE_TAG:?Set the reviewed staging image tag}
  platform: linux/amd64
  user: "10001:10001"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=64m,mode=1777"]
  pids_limit: 128
  cpus: 2
  mem_limit: 1g
  logging: *logging
  environment: &app-environment
    SAGE_ENV: production
    SAGE_ALLOWED_HOSTS: voc.sagegogo.com
    SAGE_DB_NAME: sage_staging
    SAGE_DB_USER: sage_runtime
    SAGE_DB_HOST: db
    SAGE_DB_PORT: "5432"
    SAGE_TRUSTED_PROXY_IPS: ${SAGE_STAGING_PROXY_IP:?Set the host Docker gateway address}
    SAGE_MEDIA_ROOT: /app/media
    SAGE_AVATAR_LOCAL_FLOCK_VERIFIED: "0"
    SAGE_AUTH_EMAIL_ENABLED: "0"
    SAGE_AUTH_PHONE_ENABLED: "0"
    SAGE_AUTH_GOOGLE_ENABLED: "0"
    SAGE_AUTH_REGISTRATION_ENABLED: "0"
    SAGE_AUTH_CAPTCHA_ENABLED: "0"
    SAGE_AUTH_OIDC_ENABLED: "1"
    SAGE_OIDC_ISSUER: https://auth.staging.sagegogo.com/oidc
    SAGE_OIDC_CLIENT_ID: qm3ykssujwpv0jvt14abv
    SAGE_OIDC_REDIRECT_URI: https://voc.sagegogo.com/api/auth/oidc/callback
    SAGE_OIDC_POST_LOGOUT_REDIRECT_URI: https://voc.sagegogo.com/
    SAGE_OIDC_SCOPE: openid profile email phone
    SAGE_AUTH_LEGACY_LOGIN_ENABLED: "0"
    SAGE_ACCOUNT_DELETION_ENABLED: "0"
  networks: [backend, edge]

services:
  db:
    image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    platform: linux/amd64
    user: "999:999"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    cpus: 2
    mem_limit: 1g
    logging: *logging
    environment:
      POSTGRES_DB: sage_staging
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
    secrets:
      - source: db_admin_password
        target: db_admin_password
      - source: db_runtime_password
        target: db_runtime_password
      - source: db_migrate_password
        target: db_migrate_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker-init-staging.sql:/docker-entrypoint-initdb.d/10-sage.sql:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,uid=999,gid=999,mode=0755
    networks: [backend]
    healthcheck:
      test: [CMD, pg_isready, -h, "127.0.0.1", -U, postgres, -d, sage_staging]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 60s

  app:
    <<: *app
    restart: unless-stopped
    secrets:
      - django_key
      - source: db_runtime_password
        target: db_password
      - source: auth_credentials
        target: auth_credentials.json
    volumes: [avatars:/app/media]
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import http.client; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=4); c.request('GET','/health/ready',headers={'Host':'voc.sagegogo.com','X-Forwarded-Proto':'https'}); raise SystemExit(0 if c.getresponse().status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 35s

  migrate:
    <<: *app
    profiles: [tools]
    environment:
      <<: *app-environment
      SAGE_DB_USER: sage_migrate
    secrets:
      - django_key
      - source: db_migrate_password
        target: db_password
      - source: auth_credentials
        target: auth_credentials.json
    command: [python, manage.py, migrate, --noinput]
    depends_on:
      db: {condition: service_healthy}

networks:
  backend:
    internal: true
  edge: {}

volumes:
  pgdata: {}
  avatars: {}

secrets:
  django_key: {file: "${SAGE_DOCKER_SECRETS_DIR:?Set the private secret directory}/django_key"}
  db_admin_password: {file: "${SAGE_DOCKER_SECRETS_DIR:?Set the private secret directory}/db_admin_password"}
  db_runtime_password: {file: "${SAGE_DOCKER_SECRETS_DIR:?Set the private secret directory}/db_runtime_password"}
  db_migrate_password: {file: "${SAGE_DOCKER_SECRETS_DIR:?Set the private secret directory}/db_migrate_password"}
  auth_credentials: {file: "${SAGE_DOCKER_SECRETS_DIR:?Set the private secret directory}/auth_credentials.json"}
