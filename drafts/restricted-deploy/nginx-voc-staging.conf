# G4 staging website vhost. Install as /etc/nginx/conf.d/voc.sagegogo.com.conf
# after the certificate exists. Port 80 keeps ACME reachable and redirects.
server {
    listen 80;
    listen [::]:80;
    server_name voc.sagegogo.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name voc.sagegogo.com;
    ssl_certificate /etc/letsencrypt/live/voc.sagegogo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voc.sagegogo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    root /srv/sage-staging/dist;
    index index.html;
    autoindex off;
    client_max_body_size 3m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Keep the browser-visible authority; gunicorn trusts this exact proxy peer.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For '';
    proxy_set_header X-Forwarded-Protocol '';
    proxy_set_header X-Forwarded-Ssl '';
    proxy_set_header Forwarded '';
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    proxy_next_upstream off;

    location ~ /\. { return 404; }
    location ~ ^/(api/|health/(live|ready)$) {
        proxy_pass http://127.0.0.1:8001;
    }
    location /static/ {
        alias /srv/sage-staging/static/;
    }
    location /media/ { return 404; }
    location /avatars/ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
