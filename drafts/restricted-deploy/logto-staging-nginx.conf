# G1 Logto staging host nginx vhost.
# Include from the host nginx http {} block after the existing vhosts.
# The admin console is intentionally absent; use an SSH tunnel to 127.0.0.1:3102.
# Replace certificate paths with the staging host's real files, then run nginx -t.

server {
    listen 443 ssl;
    server_name auth.staging.sagegogo.com;

    ssl_certificate     /etc/letsencrypt/live/auth.staging.sagegogo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.staging.sagegogo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 1m;

    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    access_log /var/log/nginx/logto-staging-access.log;
    error_log  /var/log/nginx/logto-staging-error.log warn;

    location ^~ /console {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
