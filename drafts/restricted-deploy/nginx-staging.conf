# 草案，放入 Nginx http 上下文后使用。不得未经检查复制覆盖现有 nginx.conf。
# 证书、私钥及受限浏览器访问通道尚未配置；本轮未安装/启动。
log_format sage_no_query '$time_iso8601 $request_method $uri $status '
                         '$body_bytes_sent $request_time $request_id';

server {
    listen 127.0.0.1:8443 ssl default_server;
    server_name sagegogo.com;
    ssl_certificate /etc/sage/tls/sagegogo.com.fullchain.pem;
    ssl_certificate_key /etc/sage/tls/sagegogo.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != sagegogo.com) { return 444; }

    root /opt/sage/current/dist;
    index index.html;
    autoindex off;
    server_tokens off;
    client_max_body_size 3m;
    access_log /var/log/nginx/sage-staging-access.log sage_no_query;
    error_log /var/log/nginx/sage-staging-error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security 'max-age=31536000' always;

    # 保留8443等实际authority，避免Origin与Host端口不一致导致CSRF失败。
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For '';
    proxy_set_header X-Forwarded-Protocol '';
    proxy_set_header X-Forwarded-Ssl '';
    proxy_set_header Forwarded '';
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    proxy_next_upstream off;
    proxy_buffering on;

    location ~ /\. { return 404; }
    location = /sales { return 308 /sales/; }
    location ~ ^/(api/|sales/|health/(live|ready)$) {
        proxy_pass http://127.0.0.1:8000;
    }
    location /static/ {
        alias /opt/sage/current/tmp/admin-static/;
    }
    # 私有头像只能经已有鉴权API读取，不能整体映射媒体目录。
    location /media/ { return 404; }
    location /avatars/ { return 404; }
    location / {
        try_files $uri $uri/ =404;
    }
}
