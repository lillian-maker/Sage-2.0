<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>价格 · Sage</title><link rel="stylesheet" href="billing.css?v=79a5c790c739"><script src="billing.js?v=32aed62fb733" defer></script><link rel="stylesheet" href="content-pages.css?v=dfb6f3f6f91a"><script src="site-shell.js?v=0c5460bfc23b" defer></script></head>
<body data-billing-page="pricing"><div id="billing-root"><p role="status">正在加载 Sage 方案…</p></div><noscript>请启用 JavaScript 查看方案。当前未开放收款。</noscript><style>
.sage-language{position:relative;display:inline-flex;flex-shrink:0;color:inherit}
.sage-language .sage-language-toggle{width:44px;height:44px;padding:10px;display:grid;place-items:center;border:1px solid transparent;border-radius:8px;background:transparent;color:inherit;cursor:pointer;touch-action:manipulation}
.sage-language-toggle svg{width:24px;height:24px;display:block}
.sage-language .sage-language-toggle:hover,.sage-language .sage-language-toggle[aria-expanded="true"]{background:rgba(145,150,158,.15)}
.sage-language .sage-language-menu{position:absolute;top:calc(100% + 8px);right:0;z-index:1000;width:184px;max-width:calc(100vw - 32px);padding:6px;margin:0;border:1px solid #e4e9ef;border-radius:10px;background:#fff;color:#202b38;box-shadow:0 8px 28px #14243a14,0 2px 6px #14243a08;list-style:none;text-align:left}
.sage-language-menu[hidden]{display:none}
.sage-language-menu::before{content:'';position:absolute;left:0;right:0;top:-9px;height:9px}
.sage-language .sage-language-menu a{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:44px;padding:10px 12px;border:0;border-radius:6px;font:400 14px/1.5 Arial,"PingFang SC","Microsoft YaHei",sans-serif;color:#526171;text-decoration:none;white-space:nowrap;letter-spacing:0}
.sage-language .sage-language-menu a:hover{background:#f4f7fb;color:#202b38}
.sage-language .sage-language-menu a[aria-current="true"]{background:#edf3f9;color:#396397;font-weight:500}
.sage-language .sage-language-menu a[aria-current="true"]::after{content:'✓';font-size:15px}
.sage-language button:focus-visible,.sage-language a:focus-visible{outline:2px solid #396397;outline-offset:3px}
</style>
<script>
(()=>{
 function initialize(){
 let root=document.querySelector('.sage-language');
 if(!root){
   const link=document.querySelector('.cp-tools>a[lang],.nav-actions>a[lang],.r-tools>a[lang]');
   if(!link)return;
   const en=document.documentElement.lang==='en',name=location.pathname.split('/').pop().replace('-en.html','').replace('.html','');
   if(name==='product')return; // No published English product route.
   root=document.createElement('div');root.className='sage-language';
   root.innerHTML=`<button class="sage-language-toggle" type="button" aria-label="${en?'Select language':'选择语言'}" aria-expanded="false" aria-controls="sage-language-menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg></button><ul class="sage-language-menu" id="sage-language-menu" aria-label="${en?'Select language':'选择语言'}" hidden><li><a href="pricing-en.html" lang="en" hreflang="en" ${en?'aria-current="true"':''}>English</a></li><li><a href="pricing.html" lang="zh-CN" hreflang="zh-CN" ${en?'':'aria-current="true"'}>中文</a></li></ul>`;
   link.replaceWith(root);
 }
 if(root.dataset.languageReady)return;root.dataset.languageReady='true';
 const button=root.querySelector('button'),menu=root.querySelector('ul'),links=[...menu.querySelectorAll('a')];
 function syncLinks(){links.forEach(link=>{const url=new URL(link.href);url.search=location.search;url.hash=location.hash;link.href=url.href;});}
 syncLinks();
 document.addEventListener('sage:location-updated',syncLinks);
 window.addEventListener('popstate',syncLinks);
 function close(restore=false){menu.hidden=true;button.setAttribute('aria-expanded','false');if(restore)button.focus();}
 function open(){syncLinks();menu.hidden=false;button.setAttribute('aria-expanded','true');}
 root.addEventListener('pointerenter',event=>{if(event.pointerType==='mouse')open();});
 root.addEventListener('pointerleave',event=>{if(event.pointerType==='mouse'&&!menu.contains(document.activeElement))close();});
 button.addEventListener('click',event=>{if(event.pointerType==='mouse'){open();return;}if(menu.hidden)open();else close();});
 button.addEventListener('keydown',event=>{if(event.key==='ArrowDown'){event.preventDefault();event.stopPropagation();menu.hidden=false;button.setAttribute('aria-expanded','true');links[0].focus();}});
 root.addEventListener('keydown',event=>{
   if(event.key==='Escape'){event.preventDefault();close(true);}
   const i=links.indexOf(document.activeElement);
   if(i>=0&&(event.key==='ArrowDown'||event.key==='ArrowUp')){event.preventDefault();links[(i+(event.key==='ArrowDown'?1:links.length-1))%links.length].focus();}
 });
 document.addEventListener('click',event=>{if(!root.contains(event.target))close();});
 document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!event.defaultPrevented&&!menu.hidden){event.preventDefault();close(true);}});
 root.addEventListener('focusout',event=>{if(event.relatedTarget&&!root.contains(event.relatedTarget))close();});
 }
 initialize();
 new MutationObserver(initialize).observe(document.body,{childList:true,subtree:true});
})();
</script>
</body></html>
