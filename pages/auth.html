<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录与注册 · Sage</title><link rel="stylesheet" href="redesign.css"><link rel="stylesheet" href="experience.css"><script src="experience.js" defer></script></head><body class="sage-page page-auth"><a class="skip-link" href="#main">跳至内容</a><header class="r-nav"><a class="r-brand" href="../index.html">Sage</a><a class="xp-return" href="trial.html">返回体验</a><div class="sage-language"><button class="sage-language-toggle" type="button" aria-label="选择语言" aria-expanded="false" aria-controls="sage-language-menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg></button><ul class="sage-language-menu" id="sage-language-menu" aria-label="选择语言" hidden><li><a href="auth-en.html" lang="en" hreflang="en" >English</a></li><li><a href="auth.html" lang="zh-CN" hreflang="zh-CN" aria-current="true">中文</a></li></ul></div></header><main id="main" class="xp-auth"><img class="xp-auth-mark" src="sage-mark.svg" width="64" height="64" alt="Sage"><h1>欢迎来到 Sage</h1><p class="xp-intro">让工作与成果，留在你的空间。</p><form id="auth-form" class="xp-auth-card"><div class="xp-auth-modes" aria-label="账户操作"><button type="button" data-auth-mode="login" aria-pressed="true" class="active">登录</button><button type="button" data-auth-mode="register" aria-pressed="false">注册</button></div><div class="xp-auth-methods" aria-label="验证方式"><button type="button" data-auth-method="email" class="active" aria-pressed="true">邮箱验证</button><button type="button" data-auth-method="phone" aria-pressed="false">手机验证</button></div><label for="auth-contact" id="contact-label">邮箱</label><input id="auth-contact" type="email" autocomplete="email" placeholder="you@company.com" required><label for="auth-code">验证码</label><div class="xp-code-row"><input id="auth-code" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" placeholder="输入验证码" required><button type="button" id="request-code">获取验证码</button></div><div id="invite-fields" hidden><label for="invite-code">邀请码</label><input id="invite-code" maxlength="64" autocomplete="off" placeholder="输入邀请人的邀请码"><label class="xp-check"><input type="checkbox" id="no-invite">没有邀请码</label></div><p id="auth-feedback" role="status" class="xp-field-message">验证服务尚未接通，不会发送验证码或创建账户。</p><button type="submit" class="r-button">继续</button><p class="xp-small">正式开放前将补齐服务条款与隐私政策；当前不收集或上传联系方式。</p></form><a class="xp-return xp-text-button" href="trial.html">← 返回原任务，保留当前预览</a><a class="xp-text-button" href="profile.html">查看账户页面结构 →</a></main><style>
.sage-language{position:relative;display:inline-flex;flex-shrink:0;color:inherit}
.sage-language .sage-language-toggle{width:40px;height:40px;padding:8px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:inherit;cursor:pointer}
.sage-language-toggle svg{width:24px;height:24px;display:block}
.sage-language .sage-language-toggle:hover,.sage-language .sage-language-toggle[aria-expanded="true"]{background:rgba(145,150,158,.15)}
.sage-language .sage-language-menu{position:absolute;top:calc(100% + 14px);right:0;z-index:1000;min-width:204px;padding:7px;margin:0;border-radius:16px;background:#f9f9f9;color:#181818;box-shadow:0 12px 38px rgba(0,0,0,.18),0 2px 7px rgba(0,0,0,.06);list-style:none;text-align:left}
.sage-language-menu[hidden]{display:none}
.sage-language .sage-language-menu a{display:block;padding:12px 14px;border-radius:10px;font:400 18px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#181818;text-decoration:none;white-space:nowrap;letter-spacing:0}
.sage-language .sage-language-menu a:hover{background:#ededed}
.sage-language .sage-language-menu a[aria-current="true"]{background:#e3e3e3}
.sage-language button:focus-visible,.sage-language a:focus-visible{outline:2px solid #8295a7;outline-offset:3px}
@media(max-width:420px){.sage-language .sage-language-menu{min-width:172px}.sage-language .sage-language-menu a{font-size:17px}}
</style>
<script>
(()=>{
 const root=document.querySelector('.sage-language');if(!root)return;
 const button=root.querySelector('button'),menu=root.querySelector('ul'),links=[...menu.querySelectorAll('a')];
 links.forEach(link=>{const url=new URL(link.href);url.search=location.search;url.hash=location.hash;link.href=url.href;});
 function close(restore=false){menu.hidden=true;button.setAttribute('aria-expanded','false');if(restore)button.focus();}
 button.addEventListener('click',()=>{const open=menu.hidden;menu.hidden=!open;button.setAttribute('aria-expanded',String(open));});
 button.addEventListener('keydown',event=>{if(event.key==='ArrowDown'){event.preventDefault();event.stopPropagation();menu.hidden=false;button.setAttribute('aria-expanded','true');links[0].focus();}});
 root.addEventListener('keydown',event=>{
   if(event.key==='Escape'){event.preventDefault();close(true);}
   const i=links.indexOf(document.activeElement);
   if(i>=0&&(event.key==='ArrowDown'||event.key==='ArrowUp')){event.preventDefault();links[(i+(event.key==='ArrowDown'?1:links.length-1))%links.length].focus();}
 });
 document.addEventListener('click',event=>{if(!root.contains(event.target))close();});
 root.addEventListener('focusout',event=>{if(event.relatedTarget&&!root.contains(event.relatedTarget))close();});
})();
</script>
</body></html>
